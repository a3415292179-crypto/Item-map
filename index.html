<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物品地图 · Creator Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span>物品地图</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" data-view="dashboard" class="nav-item active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>首页</span>
        </a>
        <a href="#" data-view="assets" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>设备库</span>
          <span class="badge" id="asset-count">0</span>
        </a>
        <a href="#" data-view="spaces" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>空间管理</span>
        </a>
        <a href="#" data-view="workflows" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>创作模板</span>
        </a>
        <a href="#" data-view="studio" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          <span>拍摄准备</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar">创</div>
          <div class="user-name">创作者</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="global-search" placeholder="搜索设备、位置... (⌘K)" autocomplete="off">
          <div class="search-results" id="search-results"></div>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="btn-add-asset" title="添加设备">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="btn-icon" id="btn-add-space" title="添加空间">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          </button>
        </div>
      </header>

      <div class="views-container">

        <section class="view active" id="view-dashboard">
          <div class="dashboard-hero">
            <h1 id="greeting">早上好</h1>
            <p>今天准备拍什么？</p>
          </div>
          <div class="dashboard-quick-actions">
            <button class="quick-action" data-content-type="product-review">
              <div class="quick-action-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
              <span>产品评测</span>
            </button>
            <button class="quick-action" data-content-type="unboxing">
              <div class="quick-action-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
              <span>开箱</span>
            </button>
            <button class="quick-action" data-content-type="vlog">
              <div class="quick-action-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
              <span>Vlog</span>
            </button>
            <button class="quick-action" data-content-type="desk-setup">
              <div class="quick-action-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
              <span>桌面视频</span>
            </button>
          </div>
          <div class="dashboard-grid">
            <div class="card">
              <div class="card-header">
                <h3>最近设备</h3>
                <a href="#" data-view="assets">查看全部</a>
              </div>
              <div class="recent-assets" id="recent-assets"></div>
            </div>
            <div class="card">
              <div class="card-header">
                <h3>最近模板</h3>
                <a href="#" data-view="workflows">查看全部</a>
              </div>
              <div class="recent-workflows" id="recent-workflows"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>设备统计</h3></div>
            <div class="stats-grid" id="stats-grid"></div>
          </div>
        </section>

        <section class="view" id="view-assets">
          <div class="view-header">
            <h2>设备库</h2>
            <div class="view-controls">
              <select id="category-filter">
                <option value="">全部分类</option>
                <option value="camera">相机</option>
                <option value="lens">镜头</option>
                <option value="audio">音频</option>
                <option value="lighting">灯光</option>
                <option value="storage">存储</option>
                <option value="computer">电脑</option>
                <option value="accessory">配件</option>
              </select>
              <select id="location-filter">
                <option value="">全部位置</option>
              </select>
              <button class="btn-primary" id="btn-add-asset-modal">+ 添加设备</button>
            </div>
          </div>
          <div class="assets-grid" id="assets-grid"></div>
        </section>

        <section class="view" id="view-spaces">
          <div class="view-header">
            <h2>空间管理</h2>
            <button class="btn-primary" id="btn-add-space-modal">+ 添加空间</button>
          </div>
          <div class="spaces-layout">
            <div class="card space-tree-card">
              <div class="card-header"><h3>空间树</h3></div>
              <div class="space-tree" id="space-tree"></div>
            </div>
            <div class="card space-details-card">
              <div class="card-header"><h3 id="selected-space-name">选择空间</h3></div>
              <div class="space-items" id="space-items"></div>
            </div>
          </div>
        </section>

        <section class="view" id="view-workflows">
          <div class="view-header">
            <h2>创作模板</h2>
            <button class="btn-primary" id="btn-add-workflow">+ 新建模板</button>
          </div>
          <div class="workflows-grid" id="workflows-grid"></div>
        </section>

        <section class="view" id="view-studio">
          <div class="studio-header">
            <h2>拍摄准备</h2>
            <p>选择内容类型，生成设备方案</p>
          </div>
          <div class="studio-content-types" id="studio-content-types">
            <button class="content-type-card" data-type="product-review">
              <div class="ct-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
              <span class="ct-title">产品评测</span>
              <span class="ct-desc">评测类视频拍摄</span>
            </button>
            <button class="content-type-card" data-type="unboxing">
              <div class="ct-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
              <span class="ct-title">开箱</span>
              <span class="ct-desc">产品开箱展示</span>
            </button>
            <button class="content-type-card" data-type="vlog">
              <div class="ct-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
              <span class="ct-title">Vlog</span>
              <span class="ct-desc">日常记录拍摄</span>
            </button>
            <button class="content-type-card" data-type="desk-setup">
              <div class="ct-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
              <span class="ct-title">桌面视频</span>
              <span class="ct-desc">桌面场景拍摄</span>
            </button>
          </div>
          <div class="studio-result hidden" id="studio-result">
            <div class="result-header">
              <h3 id="result-title">产品评测方案</h3>
              <button class="btn-secondary" id="btn-back-studio">← 返回</button>
            </div>
            <div class="result-equipment" id="result-equipment"></div>
            <div class="result-actions">
              <button class="btn-primary" id="btn-save-session">拍摄完成</button>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="modal" id="modal-asset">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-asset-title">添加设备</h3>
        <button class="modal-close" onclick="closeModal('modal-asset')">&times;</button>
      </div>
      <form id="asset-form">
        <input type="hidden" id="asset-id">
        <div class="form-group">
          <label>设备名称 *</label>
          <input type="text" id="asset-name" required placeholder="如：Sony A7C II">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>品牌</label>
            <input type="text" id="asset-brand" placeholder="如：Sony">
          </div>
          <div class="form-group">
            <label>型号</label>
            <input type="text" id="asset-model" placeholder="如：A7C II">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分类</label>
            <select id="asset-category">
              <option value="camera">相机</option>
              <option value="lens">镜头</option>
              <option value="audio">音频</option>
              <option value="lighting">灯光</option>
              <option value="storage">存储</option>
              <option value="computer">电脑</option>
              <option value="accessory">配件</option>
            </select>
          </div>
          <div class="form-group">
            <label>位置</label>
            <select id="asset-location"></select>
          </div>
        </div>
        <div class="form-group">
          <label>图片URL</label>
          <input type="url" id="asset-image" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="asset-notes" rows="2" placeholder="购买时间、价格、备注等"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('modal-asset')">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="modal-space">
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加空间</h3>
        <button class="modal-close" onclick="closeModal('modal-space')">&times;</button>
      </div>
      <form id="space-form">
        <div class="form-group">
          <label>空间名称 *</label>
          <input type="text" id="space-name" required placeholder="如：工作室">
        </div>
        <div class="form-group">
          <label>父级空间</label>
          <select id="space-parent">
            <option value="">无（顶级空间）</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('modal-space')">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="modal-workflow">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="modal-workflow-title">新建模板</h3>
        <button class="modal-close" onclick="closeModal('modal-workflow')">&times;</button>
      </div>
      <form id="workflow-form">
        <input type="hidden" id="workflow-id">
        <div class="form-group">
          <label>模板名称 *</label>
          <input type="text" id="workflow-name" required placeholder="如：桌面科技评测">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>内容类型</label>
            <select id="workflow-type">
              <option value="product-review">产品评测</option>
              <option value="unboxing">开箱</option>
              <option value="vlog">Vlog</option>
              <option value="desk-setup">桌面视频</option>
            </select>
          </div>
          <div class="form-group">
            <label>描述</label>
            <input type="text" id="workflow-desc" placeholder="简要描述">
          </div>
        </div>
        <div class="form-group">
          <label>添加设备</label>
          <div class="workflow-assets" id="workflow-assets"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('modal-workflow')">取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
